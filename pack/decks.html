<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Deck Chooser — Atlas of the Build Loop</title>
  <link rel="stylesheet" href="assets/pack.css"/>
  <style>
    .deck{display:flex;gap:.65rem;align-items:flex-start;background:linear-gradient(90deg,rgba(28,93,104,.08),var(--card) 40%);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:12px;padding:.75rem 1rem;margin:.45rem 0;cursor:pointer;box-shadow:var(--shadow)}
    .deck input{width:1.1rem;height:1.1rem;flex:0 0 auto;margin-top:.2rem}
    .deck span{flex:1;color:var(--text);font-size:.95rem}
    .row{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
    button,.btn{border:1px solid var(--border);background:var(--btn);color:var(--text);border-radius:10px;padding:.55rem .9rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .btn.primary{background:linear-gradient(180deg,#7ee8d4,#2bb89a);border-color:#9af0dc;color:#062f2c}
    .btn.is-disabled{opacity:.45;cursor:not-allowed}
    .is-hidden{display:none !important}
  </style>
</head>
<body>
<a class="skip-link" href="#chooser">Skip to deck chooser</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">the Build Loop</a>
    <nav><a href="index.html">Cover</a> <a href="contents.html">Contents</a> <a href="04_labs/index.html">Labs</a> <a href="dashboard.html">Dashboard</a></nav>
    <button type="button" class="theme-btn" data-theme-toggle>Dim mode</button>
  </div>
</header>
<main class="wrap" id="chooser">
<h1>Deck Chooser</h1>
<p class="lead">Select lesson decks (8 questions each), then start.</p>
<div class="row">
  <button type="button" id="all">Select all</button>
  <button type="button" id="none">Select none</button>
  <button type="button" id="door">Arc A door</button>
  <button type="button" id="methods">Arc B methods</button>
  <button type="button" id="tools">Arc C tools</button>
  <button type="button" id="ship">Arc D ship</button>
</div>
<form id="f">
  <label class="deck"><input type="checkbox" value="bl-a1-diverge" checked /><span><strong>L01</strong> — Divergent and Convergent</span></label>
  <label class="deck"><input type="checkbox" value="bl-a2-cynefin" checked /><span><strong>L02</strong> — Complicated, Complex, Cynefin</span></label>
  <label class="deck"><input type="checkbox" value="bl-a3-pdca-ooda" checked /><span><strong>L03</strong> — PDCA and OODA</span></label>
  <label class="deck"><input type="checkbox" value="bl-a4-bml-diamond" checked /><span><strong>L04</strong> — BML and Double Diamond</span></label>
  <label class="deck"><input type="checkbox" value="bl-b1-discovery" checked /><span><strong>L05</strong> — Discovery and Delivery</span></label>
  <label class="deck"><input type="checkbox" value="bl-b2-coats" checked /><span><strong>L06</strong> — Agile, Scrum, Waterfall</span></label>
  <label class="deck"><input type="checkbox" value="bl-b3-levers" checked /><span><strong>L07</strong> — Cadence, WIP, DoD</span></label>
  <label class="deck"><input type="checkbox" value="bl-b4-intent" checked /><span><strong>L08</strong> — Commander’s Intent</span></label>
  <label class="deck"><input type="checkbox" value="bl-c1-protocol" checked /><span><strong>L09</strong> — Brainstorm Protocol</span></label>
  <label class="deck"><input type="checkbox" value="bl-c2-generate" checked /><span><strong>L10</strong> — Generation and Review</span></label>
  <label class="deck"><input type="checkbox" value="bl-c3-fidelity" checked /><span><strong>L11</strong> — Fidelity and Kinds</span></label>
  <label class="deck"><input type="checkbox" value="bl-c4-test" checked /><span><strong>L12</strong> — Smallest Honest Test</span></label>
  <label class="deck"><input type="checkbox" value="bl-d1-critique" checked /><span><strong>L13</strong> — Critique and Assumptions</span></label>
  <label class="deck"><input type="checkbox" value="bl-d2-reviews" checked /><span><strong>L14</strong> — Three Reviews</span></label>
  <label class="deck"><input type="checkbox" value="bl-d3-evidence" checked /><span><strong>L15</strong> — Pivot and Evidence</span></label>
  <label class="deck"><input type="checkbox" value="bl-d4-launch" checked /><span><strong>L16</strong> — Launch and Operations</span></label>
</form>
<div class="row">
  <a class="btn primary" id="go" href="03_quiz/index.html?decks=all">Start selected decks</a>
  <a class="btn" href="03_quiz/index.html?decks=all">All decks exam path</a>
</div>
<p class="note is-hidden" id="deck-error" role="alert" tabindex="-1">Select at least one deck.</p>
</main>
<script src="assets/theme.js"></script>
<script>
const boxes = [...document.querySelectorAll('input[type=checkbox]')];
const go = document.getElementById('go');
const err = document.getElementById('deck-error');
function selectedIds() {
  return boxes.filter(b=>b.checked).map(b=>b.value);
}
function sync() {
  const ids = selectedIds();
  go.setAttribute('aria-describedby', 'deck-error');
  if (ids.length === 0) {
    go.removeAttribute('href');
    go.setAttribute('aria-disabled', 'true');
    go.setAttribute('aria-invalid', 'true');
    go.setAttribute('aria-errormessage', 'deck-error');
    go.classList.add('is-disabled');
    err.classList.remove('is-hidden');
    return;
  }
  err.classList.add('is-hidden');
  go.removeAttribute('aria-disabled');
  go.removeAttribute('aria-invalid');
  go.removeAttribute('aria-errormessage');
  go.classList.remove('is-disabled');
  const q = ids.length === boxes.length ? 'all' : ids.join(',');
  go.href = '03_quiz/index.html?decks=' + encodeURIComponent(q);
}
go.addEventListener('click', function (ev) {
  sync();
  const ids = selectedIds();
  if (ids.length === 0) {
    ev.preventDefault();
    err.classList.add('is-hidden');
    void err.offsetWidth;
    err.classList.remove('is-hidden');
    err.focus?.();
    return;
  }
  if (ids.length !== boxes.length && (go.getAttribute('href') || '').indexOf('decks=all') !== -1) {
    ev.preventDefault();
    location.href = '03_quiz/index.html?decks=' + encodeURIComponent(ids.join(','));
  }
});
boxes.forEach(b=>b.addEventListener('change', sync));
document.getElementById('all').onclick = () => { boxes.forEach(b=>b.checked=true); sync(); };
document.getElementById('none').onclick = () => { boxes.forEach(b=>b.checked=false); sync(); };
document.getElementById('door').onclick = () => {
  const keep = new Set(['bl-a1-diverge','bl-a2-cynefin','bl-a3-pdca-ooda','bl-a4-bml-diamond']);
  boxes.forEach(b => b.checked = keep.has(b.value));
  sync();
};
document.getElementById('methods').onclick = () => {
  const keep = new Set(['bl-b1-discovery','bl-b2-coats','bl-b3-levers','bl-b4-intent']);
  boxes.forEach(b => b.checked = keep.has(b.value));
  sync();
};
document.getElementById('tools').onclick = () => {
  const keep = new Set(['bl-c1-protocol','bl-c2-generate','bl-c3-fidelity','bl-c4-test']);
  boxes.forEach(b => b.checked = keep.has(b.value));
  sync();
};
document.getElementById('ship').onclick = () => {
  const keep = new Set(['bl-d1-critique','bl-d2-reviews','bl-d3-evidence','bl-d4-launch']);
  boxes.forEach(b => b.checked = keep.has(b.value));
  sync();
};
sync();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/pack.css" />
  <title>Misconception Steelman Studio — Atlas of the Build Loop</title>
  <style>
    
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:78rem;margin:0 auto;padding:1.5rem 1.4rem 3rem} a{color:var(--accent);text-decoration:none}
    h1{font-size:1.4rem}.muted{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin:1rem 0}
    .weak{color:var(--bad);font-style:italic} textarea{width:100%;min-height:8rem;background:var(--inset, #eef4f8);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.7rem;margin-top:.5rem}
    button{border:0;background:linear-gradient(180deg,#7ee8d4,#2bb89a);color:#062f2c;padding:.6rem 1rem;border-radius:10px;font-weight:700;cursor:pointer;margin-top:.6rem;margin-right:.4rem}
    #next{background:var(--btn);color:var(--text);border:1px solid var(--border)}
    .score{font-size:1.3rem;color:var(--gold);font-weight:700} .checks label{display:block;margin:.35rem 0;cursor:pointer}
    #score-error{color:var(--bad);font-weight:700;min-height:1.3em;margin:.4rem 0 0}
    .model{margin-top:1rem;padding:.8rem;background:var(--inset, #eef4f8);border-radius:10px;border:1px solid var(--border);font-size:.92rem}
  </style>
</head>
<body>
  <a class="skip-link" href="#steelman">Skip to lab</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../index.html">the Build Loop</a>
      <nav>
        <a href="../index.html">Cover</a>
        <a href="../contents.html">Contents</a>
        <a href="index.html">Labs</a>
        <a href="../dashboard.html">Dashboard</a>
      </nav>
      <button type="button" class="theme-btn" data-theme-toggle>Dim mode</button>
    </div>
  </header>
  <main class="wrap" id="steelman">
    <h1>Misconception Steelman Studio</h1>
    <p class="muted">Rewrite the weak take into the strongest fair version an intelligent opponent could mean. Then self-score with the rubric.</p>
    <div class="panel">
      <div class="muted">Weak take</div>
      <p class="weak" id="weak"></p>
      <label class="muted" for="text">Your steelman
      <textarea id="text" name="text" placeholder="In the strongest fair form, the claim is… because… Evidence would include… The best objection is…"></textarea>
      </label>
      <div class="checks" id="checks"></div>
      <button id="scoreBtn">Score rubric</button>
      <button id="next">New prompt</button>
      <p id="score-error" role="status"></p>
      <p class="score" id="score"></p>
      <div class="model" id="model"></div>
    </div>
    <div id="grok-grader"></div>
  </main>
  <script src="shared.js"></script>
  <script>
                const ITEMS = [
      {
        "weak": "Some people are divergers and some are convergers.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Modes are coats. The same person should do both. Identity split wrecks the handshake.",
        "lessonId": "bl-a1-diverge",
        "title": "Divergent and Convergent Thinking"
      },
      {
        "weak": "Scoring while we brainstorm saves time.",
        "model": "Fair form, then the limit. Simultaneous scoring elects the first plausible noun and deletes the option that was the test.",
        "lessonId": "bl-a1-diverge",
        "title": "Divergent and Convergent Thinking"
      },
      {
        "weak": "Diverge means be creative and defer all decisions forever.",
        "model": "Fair form, then the limit. Diverge has a clock. Converge is half the move. Lifestyle diverge is stalling.",
        "lessonId": "bl-a1-diverge",
        "title": "Divergent and Convergent Thinking"
      },
      {
        "weak": "Cynefin types our team.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: It classifies **contexts of work**. People are not domains.",
        "lessonId": "bl-a2-cynefin",
        "title": "Complicated, Complex, and Cynefin"
      },
      {
        "weak": "Complex is more evolved than complicated.",
        "model": "Fair form, then the limit. There is no maturity ladder. A statute is not junior. A portal is not senior.",
        "lessonId": "bl-a2-cynefin",
        "title": "Complicated, Complex, and Cynefin"
      },
      {
        "weak": "If it’s hard, it’s complex.",
        "model": "Fair form, then the limit. Gearboxes are hard and complicated. Classrooms are hard and complex. Hard is not the distinction.",
        "lessonId": "bl-a2-cynefin",
        "title": "Complicated, Complex, and Cynefin"
      },
      {
        "weak": "PDCA, OODA, and Agile are the same circle.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Same spine, different jobs and clocks. Mixing labels hides the skipped scarce step.",
        "lessonId": "bl-a3-pdca-ooda",
        "title": "PDCA and OODA"
      },
      {
        "weak": "If we move faster we are doing OODA.",
        "model": "Fair form, then the limit. Speed without Orient is panic. Orient is the Schwerpunkt.",
        "lessonId": "bl-a3-pdca-ooda",
        "title": "PDCA and OODA"
      },
      {
        "weak": "Check can be ‘see how the demo feels.’",
        "model": "Fair form, then the limit. Check is a comparison named in Plan. Applause is not a measure.",
        "lessonId": "bl-a3-pdca-ooda",
        "title": "PDCA and OODA"
      },
      {
        "weak": "Build–Measure–Learn means build first.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Intellectual order is Learn → Measure → Build. The name is the visible motion, not the plan.",
        "lessonId": "bl-a4-bml-diamond",
        "title": "Build–Measure–Learn and Double Diamond"
      },
      {
        "weak": "Double Diamond is a four-stage waterfall.",
        "model": "Fair form, then the limit. It is two loops. Iterate. A failed Deliver returns to Define or Discover.",
        "lessonId": "bl-a4-bml-diamond",
        "title": "Build–Measure–Learn and Double Diamond"
      },
      {
        "weak": "Design Thinking is only for designers.",
        "model": "Fair form, then the limit. It is a problem-framing spine. Engineers and ops skip diamond 1 at the same cost.",
        "lessonId": "bl-a4-bml-diamond",
        "title": "Build–Measure–Learn and Double Diamond"
      },
      {
        "weak": "Discovery is research; delivery is engineering.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Both are products of work. Engineers discover; researchers can deliver a decision. Titles are not tracks.",
        "lessonId": "bl-b1-discovery",
        "title": "Discovery, Delivery, and Dual-Track"
      },
      {
        "weak": "Dual-track means two teams.",
        "model": "Fair form, then the limit. Two teams that never meet is the costume. Dual-track is two capacities that talk.",
        "lessonId": "bl-b1-discovery",
        "title": "Discovery, Delivery, and Dual-Track"
      },
      {
        "weak": "If we are experienced we can skip discovery.",
        "model": "Fair form, then the limit. Experience without contact still guesses. Dual-track exists because experience lies.",
        "lessonId": "bl-b1-discovery",
        "title": "Discovery, Delivery, and Dual-Track"
      },
      {
        "weak": "Agile means no plan.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Agile values responding to change over following a plan. No plan is drift.",
        "lessonId": "bl-b2-coats",
        "title": "Agile, Scrum, and Honest Waterfall"
      },
      {
        "weak": "Scrum is Agile, so any standup counts.",
        "model": "Fair form, then the limit. Scrum is a specific wrapper. A standup without a Done increment is a meeting.",
        "lessonId": "bl-b2-coats",
        "title": "Agile, Scrum, and Honest Waterfall"
      },
      {
        "weak": "Waterfall is always wrong.",
        "model": "Fair form, then the limit. It is honest when cause and effect are known. It is wrong as a freeze on a guess.",
        "lessonId": "bl-b2-coats",
        "title": "Agile, Scrum, and Honest Waterfall"
      },
      {
        "weak": "More WIP means we are faster.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: More starts usually mean later finishes. Limit WIP.",
        "lessonId": "bl-b3-levers",
        "title": "Cadence, Scope, WIP, and Definition of Done"
      },
      {
        "weak": "Cadence is how we apply deadline pressure.",
        "model": "Fair form, then the limit. Cadence is how we see. Pressure pumps destroy the instrument.",
        "lessonId": "bl-b3-levers",
        "title": "Cadence, Scope, WIP, and Definition of Done"
      },
      {
        "weak": "Scope is whatever leadership asked for this morning.",
        "model": "Fair form, then the limit. Scope is a permission for this interval. New asks displace, or they wait.",
        "lessonId": "bl-b3-levers",
        "title": "Cadence, Scope, WIP, and Definition of Done"
      },
      {
        "weak": "If I specify every step, I have communicated.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: You instructed. Complex work still needs intent when the steps change.",
        "lessonId": "bl-b4-intent",
        "title": "Commander’s Intent and the Brief"
      },
      {
        "weak": "Vision is enough.",
        "model": "Fair form, then the limit. Vision without this-round success criteria is a poster.",
        "lessonId": "bl-b4-intent",
        "title": "Commander’s Intent and the Brief"
      },
      {
        "weak": "How Might We can start from a solution we like.",
        "model": "Fair form, then the limit. Then it is a leading question, not a HMW.",
        "lessonId": "bl-b4-intent",
        "title": "Commander’s Intent and the Brief"
      },
      {
        "weak": "Brainstorming is just talking.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Without deferred judgment, capture, and a cancel rule, it is a status contest.",
        "lessonId": "bl-c1-protocol",
        "title": "Brainstorming as a Protocol"
      },
      {
        "weak": "Quality in the room saves time.",
        "model": "Fair form, then the limit. Early quality is undeclared converge. You lose the weird test.",
        "lessonId": "bl-c1-protocol",
        "title": "Brainstorming as a Protocol"
      },
      {
        "weak": "The director should steer so we stay realistic.",
        "model": "Fair form, then the limit. Steering mid-diverge is how you get last year’s idea with new nouns.",
        "lessonId": "bl-c1-protocol",
        "title": "Brainstorming as a Protocol"
      },
      {
        "weak": "More methods in one hour means more creativity.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: One method, done. Stacking is noise.",
        "lessonId": "bl-c2-generate",
        "title": "Generation Methods and Converge Reviews"
      },
      {
        "weak": "SCAMPER is for blank-page problems.",
        "model": "Fair form, then the limit. It is for attacking an existing artifact.",
        "lessonId": "bl-c2-generate",
        "title": "Generation Methods and Converge Reviews"
      },
      {
        "weak": "Devil’s advocate during generation keeps us honest.",
        "model": "Fair form, then the limit. It keeps you quiet. Schedule it after clustering.",
        "lessonId": "bl-c2-generate",
        "title": "Generation Methods and Converge Reviews"
      },
      {
        "weak": "Higher fidelity is always more professional.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Early polish persuades and freezes. Match the question.",
        "lessonId": "bl-c3-fidelity",
        "title": "Fidelity and Kinds of Prototype"
      },
      {
        "weak": "If it looks unfinished, stakeholders will not take it seriously.",
        "model": "Fair form, then the limit. Tell them the question. If they still need polish, you are demoing, not testing.",
        "lessonId": "bl-c3-fidelity",
        "title": "Fidelity and Kinds of Prototype"
      },
      {
        "weak": "Works-like can wait until after the pretty shell.",
        "model": "Fair form, then the limit. If mechanism is the risk, the shell is theater.",
        "lessonId": "bl-c3-fidelity",
        "title": "Fidelity and Kinds of Prototype"
      },
      {
        "weak": "MVP is a prototype we put on a domain.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: MVP is shipped and measured, with a kill criterion. Prototype may never ship.",
        "lessonId": "bl-c4-test",
        "title": "Pretotype, MVP, and the Riskiest Assumption"
      },
      {
        "weak": "Smallest slice means fewest screens of the full product.",
        "model": "Fair form, then the limit. It means the cheapest path to a kill/keep signal.",
        "lessonId": "bl-c4-test",
        "title": "Pretotype, MVP, and the Riskiest Assumption"
      },
      {
        "weak": "Test the assumption we are ready to build.",
        "model": "Fair form, then the limit. That is comfort. Rank by ignorance × impact.",
        "lessonId": "bl-c4-test",
        "title": "Pretotype, MVP, and the Riskiest Assumption"
      },
      {
        "weak": "Critique means being nice.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: It means being specific to the brief. Niceness without a move is stalling.",
        "lessonId": "bl-d1-critique",
        "title": "Critique, RAT, and Pre-mortem"
      },
      {
        "weak": "A quick look without a brief is harmless.",
        "model": "Fair form, then the limit. People will critique their imaginary product. Cancel.",
        "lessonId": "bl-d1-critique",
        "title": "Critique, RAT, and Pre-mortem"
      },
      {
        "weak": "What if is a brainstorm.",
        "model": "Fair form, then the limit. In critique, What if is a proposed experiment, not a new diverge session.",
        "lessonId": "bl-d1-critique",
        "title": "Critique, RAT, and Pre-mortem"
      },
      {
        "weak": "They said it was nice, so the test passed.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Task success is the named rule. Compliments are extra.",
        "lessonId": "bl-d2-reviews",
        "title": "User, Stakeholder, and Expert Review"
      },
      {
        "weak": "Stakeholders speaking is user testing.",
        "model": "Fair form, then the limit. Different truths. Payers cannot complete the contractor’s job by talking.",
        "lessonId": "bl-d2-reviews",
        "title": "User, Stakeholder, and Expert Review"
      },
      {
        "weak": "We should put users and leadership together for alignment.",
        "model": "Fair form, then the limit. Power fakes success. Separate the rooms.",
        "lessonId": "bl-d2-reviews",
        "title": "User, Stakeholder, and Expert Review"
      },
      {
        "weak": "We iterated, so we delivered.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Iteration can be learning with zero ship. Report both scoreboards.",
        "lessonId": "bl-d3-evidence",
        "title": "Pivot, Persevere, and Evidence Thresholds"
      },
      {
        "weak": "Shipping proves the idea.",
        "model": "Fair form, then the limit. Shipping proves you can operate a slice. The idea still needs evidence.",
        "lessonId": "bl-d3-evidence",
        "title": "Pivot, Persevere, and Evidence Thresholds"
      },
      {
        "weak": "Pivot is a nicer word for fail.",
        "model": "Fair form, then the limit. Kill is fail-the-job. Pivot is change-the-approach. Do not blur them to save face.",
        "lessonId": "bl-d3-evidence",
        "title": "Pivot, Persevere, and Evidence Thresholds"
      },
      {
        "weak": "Launch is a party.",
        "model": "Steelman: name the fear or incentive underneath, then the fair condition, then the limit. Reality from the lesson: Launch is a mode switch. The party is optional.",
        "lessonId": "bl-d4-launch",
        "title": "Launch, Quality, Operations, Mode Switch"
      },
      {
        "weak": "Quality is a hardening sprint after launch.",
        "model": "Fair form, then the limit. If it is after, it was never in DoD.",
        "lessonId": "bl-d4-launch",
        "title": "Launch, Quality, Operations, Mode Switch"
      },
      {
        "weak": "Stay in beta so we can keep learning.",
        "model": "Fair form, then the limit. Eternal beta is often a way to skip operations. Dependence sets the mode.",
        "lessonId": "bl-d4-launch",
        "title": "Launch, Quality, Operations, Mode Switch"
      }
    ];
    const RUBRIC = [
      "States opponent’s claim without mockery",
      "Gives strongest reasons (not weakest)",
      "Mentions evidence or conditions of truth",
      "Acknowledges limits / doesn’t overclaim",
      "Is something a smart critic might actually endorse",
    ];
    let i = 0;
    const checks = document.getElementById("checks");
    RUBRIC.forEach((r, idx) => {
      const id = "r"+idx;
      checks.innerHTML += `<label><input type="checkbox" id="${id}" /> ${r}</label>`;
    });
    let grader = { refresh() {} };
    function fillValues() {
      const weak = document.getElementById("weak").textContent.trim() || "(no weak take loaded)";
      const steel = document.getElementById("text").value.trim() || "(I have not written anything yet.)";
      const rubric = RUBRIC.map((r, idx) => {
        const on = document.getElementById("r" + idx) && document.getElementById("r" + idx).checked;
        return (on ? "[x] " : "[ ] ") + r;
      }).join("\n");
      return { WEAK: weak, STEELMAN: steel, RUBRIC: rubric };
    }
    function load() {
      document.getElementById("weak").textContent = ITEMS[i].weak;
      document.getElementById("text").value = "";
      document.getElementById("score").textContent = "";
      document.getElementById("model").textContent = "Sample steelman appears after you score (for comparison—not the only valid one).";
      RUBRIC.forEach((_, idx) => document.getElementById("r"+idx).checked = false);
      grader.refresh();
    }
    document.getElementById("scoreBtn").onclick = () => {
      const text = document.getElementById("text").value.trim();
      if (text.length < 40) {
        document.getElementById("score-error").textContent = "Write a fuller steelman (≥ ~40 chars) before scoring.";
        document.getElementById("score").textContent = "";
        document.getElementById("score-error").scrollIntoView({ behavior: "smooth", block: "nearest" });
        grader.refresh();
        return;
      }
      document.getElementById("score-error").textContent = "";
      let s = 0;
      RUBRIC.forEach((_, idx) => { if (document.getElementById("r"+idx).checked) s++; });
      document.getElementById("score").textContent = `Rubric score: ${s}/5`;
      document.getElementById("model").textContent = ITEMS[i].model;
      AtlasProgress.touchLab("steelman", { actions: 1, score: s * 20 });
      grader.refresh();
    };
    document.getElementById("next").onclick = () => { i = (i+1) % ITEMS.length; load(); };
    document.getElementById("text").addEventListener("input", () => grader.refresh());
    RUBRIC.forEach((_, idx) => {
      document.getElementById("r" + idx).addEventListener("change", () => grader.refresh());
    });
    AtlasProgress.touchLab("steelman", { visit: true });
    load();
    if (window.AtlasLabGrader) {
      grader = AtlasLabGrader.mount("grok-grader", "steelman", {
        how: "Your steelman and checked boxes fill in automatically. Copy prompt → new Grok chat → send. Ask it to teach the steelman move, not to polish your prose.",
        fillValues,
      });
      grader.refresh();
    }
  </script>

  <script src="../assets/theme.js"></script>
</body>
</html>

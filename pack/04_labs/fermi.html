    .lab-lead { max-width: none; margin: 0 0 1rem; }

      margin: 0 0 1.15rem;
    }
    .pick label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .pick select {
      flex: 1 1 18rem;
      max-width: 36rem;
      font: inherit;
      font-weight: 650;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .btn {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.primary {
      background: linear-gradient(180deg, #7ee8d4, #2bb89a);
      border-color: #9af0dc;
      color: #062f2c;
    }
    .hidden { display: none !important; }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem 1.1rem;
      margin-top: 0.85rem;
    }
    .col-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 0.4rem;
    }
    .col { display: grid; gap: 0.45rem; align-content: start; }
    .tile {
      text-align: left;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      font-weight: 650;
      font-size: 0.95rem;
      line-height: 1.35;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .tile:hover:not(:disabled) { border-color: var(--accent); }
    .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .tile.ok {
      border-color: var(--ok);
      background: var(--inset);
      color: var(--text);
      cursor: default;
    }
    .tile.bad { box-shadow: 0 0 0 2px var(--bad); }
    .tile:disabled { cursor: default; }
    .why {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: var(--inset);
      border: 1px solid var(--border);
    }
    .why.show { display: block; }
    .why .verdict { font-weight: 800; margin: 0 0 0.3rem; }
    .why .verdict.ok { color: var(--ok); }
    .why .verdict.bad { color: var(--bad); }
    .why p { margin: 0; }
    .next-btn {
      display: none;
      margin-top: 0.9rem;
      margin-right: 0.45rem;
      border: 0;
      background: linear-gradient(180deg, #7ee8d4, #2bb89a);
      color: #062f2c;
      padding: 0.65rem 1.05rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .next-btn.show { display: inline-block; }
    .ghost {
      display: none;
      margin-top: 0.9rem;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      padding: 0.65rem 1.05rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .ghost.show { display: inline-block; }
    .done h2 { margin: 0 0 0.45rem; color: var(--heading); }
    @media (max-width: 700px) {

    function shuffle(a) {
      const x = a.slice();
      for (let i = x.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [x[i], x[j]] = [x[j], x[i]];
      }
      return x;
    }

    function idsFromValue(v) {
      if (!v) return [];
      if (v === "all") return DECKS.map((d) => d.id);
      if (v === "body") return [...BODY];
      if (v === "blood") return [...BLOOD];
      return [v];
    }

    function parseUrl() {
      const q = new URLSearchParams(location.search).get("decks");
      if (!q) return "";
      if (q === "all" || q === "body" || q === "blood") return q;
      const ids = q.split(",").map((s) => s.trim()).filter((id) => DECKS.some((d) => d.id === id));
      if (ids.length === DECKS.length) return "all";
      if (ids.length === 4 && ids.every((id) => BODY.has(id))) return "body";
      if (ids.length === 4 && ids.every((id) => BLOOD.has(id))) return "blood";
      return ids[0] || "";
    }

    function writeUrl(v) {
      const url = new URL(location.href);
      if (!v) url.searchParams.delete("decks");
      else url.searchParams.set("decks", v);
      history.replaceState(null, "", url);
    }

    function begin(ids) {
      selected = ids.map((id) => DECKS.find((d) => d.id === id)).filter(Boolean);
      if (!selected.length) {
        play.classList.add("hidden");
        done.classList.add("hidden");
        return;
      }
      const one = selected.length === 1;
      rounds = selected.map((d) => ({
        id: d.id,
        title: d.num + " · " + d.title,
        pairs: one ? shuffle(d.pairs) : shuffle(d.pairs).slice(0, 6),
      }));
      r = 0;
      firstTry = 0;
      totalPairs = rounds.reduce((n, x) => n + x.pairs.length, 0);
      done.classList.add("hidden");
      play.classList.remove("hidden");
      loadRound();
    }

    deckSel.onchange = () => {
      writeUrl(deckSel.value);
      begin(idsFromValue(deckSel.value));
    };
    document.getElementById("again").onclick = () => begin(selected.map((d) => d.id));

    function meta() {
      const round = rounds[r];
      document.getElementById("meta").innerHTML =
        `${round.title} · deck ${r + 1} of ${rounds.length} · First-try <strong>${firstTry}</strong>/${totalPairs} · Matched ${matched.size}/${round.pairs.length}`;
    }

    function tile(side, pair) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tile";
      b.dataset.id = pair.id;
      b.dataset.side = side;
      b.textContent = pair[side];
      b.onclick = () => choose(side, pair.id, b);
      return b;
    }

    function loadRound() {
      const round = rounds[r];
      matched = new Set();
      missed = new Set();
      pickL = pickR = null;
      busy = false;
      byId = Object.fromEntries(round.pairs.map((p) => [p.id, p]));
      document.getElementById("roundTitle").textContent = round.title;
      why.classList.remove("show");
      why.innerHTML = "";
      next.classList.remove("show");
      leftHost.innerHTML = "";
      rightHost.innerHTML = "";
      shuffle(round.pairs).forEach((p) => leftHost.appendChild(tile("left", p)));
      shuffle(round.pairs).forEach((p) => rightHost.appendChild(tile("right", p)));
      meta();
    }

    function choose(side, id, btn) {
      if (busy || matched.has(id) || btn.classList.contains("ok")) return;
      if (side === "left") {
        play.querySelectorAll('[data-side="left"].sel').forEach((el) => el.classList.remove("sel"));
        pickL = id;
      } else {
        play.querySelectorAll('[data-side="right"].sel').forEach((el) => el.classList.remove("sel"));
        pickR = id;
      }
      btn.classList.add("sel");
      if (pickL && pickR) settle();
    }

    function settle() {
      const ok = pickL === pickR;
      const pair = byId[pickL];
      const tiles = [...play.querySelectorAll(".tile")];
      const L = tiles.find((el) => el.dataset.side === "left" && el.dataset.id === pickL);
      const R = tiles.find((el) => el.dataset.side === "right" && el.dataset.id === pickR);
      if (ok) {
        if (!missed.has(pickL)) firstTry += 1;
        matched.add(pickL);
        L.classList.remove("sel");
        R.classList.remove("sel");
        L.classList.add("ok");
        R.classList.add("ok");
        L.disabled = R.disabled = true;
        why.innerHTML = `<div class="verdict ok">Match</div><p>${pair.why}</p>`;
        why.classList.add("show");
        pickL = pickR = null;
        meta();
        AtlasProgress.touchLab("fermi", { actions: 1, score: firstTry });
        if (matched.size === rounds[r].pairs.length) roundDone();
      } else {
        busy = true;
        missed.add(pickL);
        missed.add(pickR);
        L.classList.add("bad");
        R.classList.add("bad");
        why.innerHTML = `<div class="verdict bad">Not that definition</div><p>“${pair.left}” does not match the card you picked. Both stay unmatched — try another pairing.</p>`;
        why.classList.add("show");
        AtlasProgress.touchLab("fermi", { actions: 1, score: firstTry });
        setTimeout(() => {
          L.classList.remove("bad", "sel");
          R.classList.remove("bad", "sel");
          pickL = pickR = null;
          busy = false;
        }, 700);
      }
    }

    function roundDone() {
      if (r < rounds.length - 1) {
        next.textContent = "Next lesson";
        next.classList.add("show");
        next.onclick = () => { r += 1; loadRound(); };
      } else {
        next.textContent = "See score";
        next.classList.add("show");
        next.onclick = finish;
      }
    }

    function finish() {
      play.classList.add("hidden");
      done.classList.remove("hidden");
      const names = selected.map((d) => d.num).join(", ");
      document.getElementById("doneText").innerHTML =
        `First-try matches: <strong>${firstTry}/${totalPairs}</strong> on ${names}. Term → definition.`;
      AtlasProgress.touchLab("fermi", { actions: 1, score: firstTry });
    }

    AtlasProgress.touchLab("fermi", { visit: true });

    const fromUrl = parseUrl();
    if (fromUrl) {
      deckSel.value = fromUrl;
      begin(idsFromValue(fromUrl));
    }
  </script>
</body>
</html>
